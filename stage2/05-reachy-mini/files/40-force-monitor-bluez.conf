# Workaround for reachy-mini-os#55 (bluetoothctl connect -> br-connection-profile-unavailable).
# WirePlumber 0.5's hardware.bluetooth only "wants" monitor.bluez, and the
# optional-dependency cascade through monitor.bluez.seat-monitoring (which
# needs support.logind) silently drops the bluez monitor on this image.
# Forcing monitor.bluez = required makes WirePlumber load it unconditionally.
# The "main" body below mirrors /usr/share/wireplumber/wireplumber.conf.
wireplumber.profiles = {
  main = {
    inherits = [ base ]

    metadata.sm-settings = required
    metadata.sm-objects  = required

    policy.standard = required

    hardware.audio         = required
    hardware.bluetooth     = required
    hardware.video-capture = required

    monitor.bluez                 = required
    monitor.bluez-midi            = optional
    monitor.bluez.seat-monitoring = disabled
  }
}
