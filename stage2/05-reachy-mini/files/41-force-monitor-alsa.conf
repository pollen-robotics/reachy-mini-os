# ALSA-side version of 40-force-monitor-bluez.conf (reachy-mini-os#55).
# WirePlumber 0.5's hardware.audio only "wants" monitor.alsa, and the
# optional-dependency cascade through monitor.alsa.reserve-device (which
# needs support.dbus) can drop the monitor on a session-less startup,
# leaving an empty device graph while aplay -l sees every card.
# reserve-device only matters when sound servers compete for a card.
# Requiring monitor.alsa makes WirePlumber exit instead of running without it.
# conf.d merges per-key, so these extend the "main" profile in 40-.
wireplumber.profiles = {
  main = {
    monitor.alsa = required
    monitor.alsa.reserve-device = disabled
  }
}
