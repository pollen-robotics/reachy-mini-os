name: Generate ReachyMini OS Image

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
            lfs: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y coreutils quilt parted qemu-user-static debootstrap zerofree zip \
            dosfstools e2fsprogs libarchive-tools libcap2-bin grep rsync xz-utils file git curl bc \
            gpg pigz xxd arch-test bmap-tools kmod

      - name: Set TAG environment variable from git tag
        id: set_tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Update stage2/05-reachy-mini/00-run.sh to use TAG
        run: |
            sed -i "s/ReachyMiniOS: dev/ReachyMiniOS: ${{ env.TAG }}/g" stage2/05-reachy-mini/00-run.sh

      - name: Make build.sh executable
        run: chmod +x build.sh

      - name: Build ReachyMini OS image
        run: sudo ./build.sh

      - name: Rename deploy files with tag
        run: |
          for f in deploy/*.*; do
            ext="${f##*.}"
            base="${f%.*}"
            sudo mv "$f" "${base}-${TAG}.${ext}"
          done
        env:
          TAG: ${{ env.TAG }}

      - name: Upload generated image
        uses: actions/upload-artifact@v7
        with:
            name: reachyminios-image-${{ env.TAG }}
            path: deploy/*

      - name: Release
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        with:
            files: deploy/*
            generate_release_notes: true

  # Mirror the freshly built image to a public Hugging Face Storage Bucket, which
  # the desktop flasher downloads from (its xet CDN is much faster and more
  # reliable than GitHub releases). A bucket (not a dataset) is used because we
  # only need the latest image, not a versioned history: it is overwritten
  # in place on every release. Runs only for version tags, reusing the artifact
  # from build-image so nothing is rebuilt.
  mirror-to-hf:
    name: Mirror image to Hugging Face
    needs: build-image
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download built image artifact
        uses: actions/download-artifact@v7
        with:
            name: reachyminios-image-${{ github.ref_name }}
            path: deploy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.12'

      - name: Install huggingface_hub
        run: pip install --upgrade "huggingface_hub>=1.5"

      - name: Push image + manifest to the HF bucket mirror
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_BUCKET_REPO: pollen-robotics/reachy-mini-os
          TAG: ${{ github.ref_name }}
        run: python .github/scripts/mirror_to_hf.py
